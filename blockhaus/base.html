<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title></title>


    <link rel="icon" type="image/png" href="https://i.postimg.cc/Y2g29xsg/Design-sans-titre-(30).png" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #bdb7a8;
            min-height: 100vh;
            color: #000;
        }

        #contenu {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255,255,255,0.78);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        h2 {
            margin-top: 30px;
        }

        p, li {
            line-height: 1.7;
        }

        .retour {
            display: inline-block;
            margin-bottom: 25px;
            color: #2f5e87;
            text-decoration: none;
            font-weight: bold;
        }

        .fiche {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: rgba(0,0,0,0.78);
            color: white;
            padding: 22px;
            border-radius: 12px;
        }

        .fiche p {
            margin: 6px 0;
        }

        .fiche strong {
            color: #9fd0e8;
        }

        .intro {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.58);
            border-radius: 10px;
        }

        .schema {
            display: block;
            width: min(100%, 650px);
            margin: 20px auto;
            border-radius: 10px;
        }

        .galerie {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .galerie img {
            display: block;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            cursor: zoom-in;
        }

        .legende {
            text-align: center;
            font-size: 0.92em;
            color: #444;
            margin-top: 8px;
        }

        .boutons {
            text-align: center;
            margin-top: 30px;
        }

        .action-btn {
            display: inline-block;
            margin: 8px;
            padding: 12px 22px;
            background: #2f5e87;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #1e4566;
            transform: translateY(-2px);
        }

        .logo-fin {
            text-align: center;
            margin: 35px 0 10px;
        }

        .logo-fin img {
            width: 170px;
            max-width: 80%;
            height: auto;
            border-radius: 10px;
        }

        .mentions-btn {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            background: rgba(0,0,0,0.4);
            padding: 6px 10px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            #contenu {
                margin: 15px;
                padding: 20px;
            }

            .fiche, .galerie {
                grid-template-columns: 1fr;
            }
        }
    
        .plan-slot {
            display: block;
            width: min(100%, 650px);
            margin: 20px auto;
        }

        .plan-slot img {
            display: block;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            cursor: zoom-in;
        }
    </style>
<body>
    
    <header>
    Les Blockhaus Lyssois - 
  </header>

  <iframe src="documents/NOM DU DOC" frameborder="0"></iframe>

</body>
</html>
